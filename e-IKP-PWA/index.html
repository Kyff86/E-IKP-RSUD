<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>e-IKP RSUD Merauke</title>
<meta name="theme-color" content="#00236f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="e-IKP Merauke">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #00236f; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #splash { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #00236f; color: #fff; text-align: center; padding: 24px; transition: opacity .3s; }
  #splash.done { opacity: 0; pointer-events: none; }
  #splash img { width: 96px; height: 96px; border-radius: 20px; background: #fff; padding: 6px; box-sizing: border-box; }
  #splash h1 { margin: 0; font-size: 18px; }
  #splash p { margin: 0; font-size: 13px; opacity: .85; max-width: 320px; line-height: 1.5; }
  .spin { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #slow, #setup, #offline { display: none; }
  #slow a, #setup code { color: #fff; font-weight: 700; }
  #setup code { background: rgba(255,255,255,.15); padding: 2px 6px; border-radius: 4px; }
  #install { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: none; background: #00236f; color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
</style>
</head>
<body>

<div id="splash">
  <img src="icons/icon-192.png" alt="Logo RSUD Merauke">
  <h1>e-IKP RSUD Merauke</h1>
  <div class="spin" id="spin"></div>
  <p id="msg">Memuat aplikasi...</p>
  <p id="slow">Lama memuat? Periksa sinyal internet, atau <a id="direct" href="#" target="_top">buka langsung</a>.</p>
  <p id="offline">Tidak ada koneksi internet. Aplikasi akan terbuka otomatis saat sinyal kembali.</p>
  <p id="setup">Alamat aplikasi belum diatur. Buka <code>index.html</code>, lalu ganti nilai <code>APP_URL</code> dengan URL Web App (berakhiran /exec).</p>
</div>

<iframe id="app" title="e-IKP RSUD Merauke" allow="clipboard-write; fullscreen; camera; geolocation" referrerpolicy="no-referrer-when-downgrade"></iframe>
<button id="install" type="button">Pasang Aplikasi</button>

<script>
  // ============================================================
  // SATU-SATUNYA YANG PERLU DIUBAH: tempel URL Web App Anda (berakhiran /exec).
  // Contoh: "https://script.google.com/macros/s/AKfycb.../exec"
  // ============================================================
  const APP_URL = "AKfycbz4xsr1V-4O6xGxQ1kf6u1B-4PNfIkX47VfDZOLIJkWppQY8QoVp8Ggu9NbRp685zOl";

  const $ = id => document.getElementById(id);
  const frame = $('app'), splash = $('splash');
  let loaded = false, slowTimer = null;

  function configured() { return /^https:\/\/script\.google\.com\/(macros\/s\/|a\/).+\/exec/.test(APP_URL); }

  function load() {
    if (!configured()) {
      $('spin').style.display = 'none'; $('msg').style.display = 'none'; $('setup').style.display = 'block';
      return;
    }
    if (!navigator.onLine) { showOffline(true); return; }
    showOffline(false);
    $('direct').href = APP_URL;
    loaded = false;
    frame.src = APP_URL;
    clearTimeout(slowTimer);
    slowTimer = setTimeout(() => { if (!loaded) $('slow').style.display = 'block'; }, 10000);
  }
  function showOffline(on) {
    $('offline').style.display = on ? 'block' : 'none';
    $('msg').style.display = on ? 'none' : 'block';
    $('spin').style.display = on ? 'none' : 'block';
    splash.classList.remove('done');
  }
  frame.addEventListener('load', () => {
    if (!frame.src || frame.src === location.href) return;
    loaded = true; clearTimeout(slowTimer); splash.classList.add('done');
  });
  window.addEventListener('online', () => { if (!loaded) load(); });
  window.addEventListener('offline', () => { if (!loaded) showOffline(true); });

  // Tombol "Pasang Aplikasi" (muncul bila Chrome mengizinkan pemasangan)
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    if (!window.matchMedia('(display-mode: standalone)').matches) $('install').style.display = 'block';
  });
  $('install').addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt(); await deferred.userChoice; deferred = null; $('install').style.display = 'none';
  });
  window.addEventListener('appinstalled', () => { $('install').style.display = 'none'; });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  load();
</script>
</body>
</html>
